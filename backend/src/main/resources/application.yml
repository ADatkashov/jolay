spring:
  application.name: jolay-backend
  datasource:
    url: ${JOLAY_DB_URL:jdbc:postgresql://localhost:5432/jolay}
    username: ${JOLAY_DB_USER:jolay}
    password: ${JOLAY_DB_PASSWORD:jolay}
    hikari:
      maximum-pool-size: ${JOLAY_DB_POOL:20}
      # Audit finding: PostgreSQL's default jit=on added ~2.7 s of compile time to a 19 ms PostGIS query
      connection-init-sql: SET jit = off
  flyway.enabled: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet.multipart.max-file-size: 5MB
  servlet.multipart.max-request-size: 6MB

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never

springdoc:
  api-docs.path: /api/v1/docs
  swagger-ui.path: /api/v1/swagger-ui

jolay:
  geocoding:
    # 2GIS API key: address search, reverse geocoding, routing and map tiles (all through the backend). Secret: set it in the environment, never commit it.
    twogis-key: ${JOLAY_2GIS_KEY:}
    twogis-url: https://catalog.api.2gis.com
    # Optional 2GIS region id (from the 2GIS Regions API) if Suggest asks for a geographic restriction.
    twogis-region-id: ${JOLAY_2GIS_REGION_ID:}
    timeout-ms: 1500
    failures-to-open: 3
    open-seconds: 30
  routing:
    # 2GIS Routing API; used when JOLAY_2GIS_KEY is set. Without a key: development estimate (great-circle x detour factor, flagged ESTIMATED).
    twogis-url: https://routing.api.2gis.com
    timeout-ms: 2000
    failures-to-open: 3
    open-seconds: 30
  maps:
    # Raster tiles are fetched from 2GIS by the backend (GET /api/v1/geo/tiles/{z}/{x}/{y}.png) so the key never reaches the apps.
    tile-host: https://tile{n}.maps.2gis.com
    tileset: online_hd
    cache-tiles: 1500
    timeout-ms: 3000
    failures-to-open: 5
    open-seconds: 20
  security:
    # MUST be overridden in every non-local environment (>= 32 bytes). See docs/SECURITY.md.
    jwt-secret: ${JOLAY_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-ttl: PT15M
    refresh-ttl: P30D
    cors-origins: ${JOLAY_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
    otp-length: 6
    otp-ttl: PT5M
    otp-max-attempts: 5
    otp-max-per-hour: 5
    login-max-failures: 5
    login-lockout: PT15M
  sms:
    # No gateway switch here: an SMS gateway is a SmsSender bean named productionSmsSender (see docs/DEPLOYMENT.md). Without one, only the development log sender exists.
    log-code: ${JOLAY_SMS_LOG_CODE:false}    # development only: write OTP to log
  whatsapp:
    # WhatsApp is the PRIMARY channel for OTP/SOS texts; the SMS sender above is used only when WhatsApp cannot deliver (no WhatsApp, error, timeout).
    enabled: ${JOLAY_WHATSAPP_ENABLED:false}
    base-url: ${JOLAY_WHATSAPP_BASE_URL:https://graph.facebook.com/v21.0}
    phone-number-id: ${JOLAY_WHATSAPP_PHONE_NUMBER_ID:}
    token: ${JOLAY_WHATSAPP_TOKEN:}
    template: ${JOLAY_WHATSAPP_TEMPLATE:}    # approved UTILITY template whose body is exactly {{1}} (SOS alerts)
    otp-template: ${JOLAY_WHATSAPP_OTP_TEMPLATE:}   # approved AUTHENTICATION template with a Copy code button (OTP); empty = OTP via the generic template
    language: ${JOLAY_WHATSAPP_LANGUAGE:ru}
  payments:
    provider: ${JOLAY_PAYMENT_PROVIDER:sandbox}
    sandbox-webhook-secret: ${JOLAY_SANDBOX_WEBHOOK_SECRET:dev-sandbox-secret}
    public-base-url: ${JOLAY_PUBLIC_URL:http://localhost:8080}
  push:
    # Empty = DEVELOPMENT MOCK (messages are only recorded in push_outbox). Set to a Google service-account JSON to enable real FCM.
    fcm.service-account-file: ${JOLAY_FCM_SERVICE_ACCOUNT_FILE:}
  storage:
    documents-dir: ${JOLAY_DOCS_DIR:./data/documents}
  dispatch:
    scheduler-delay-ms: 2000
  admin-bootstrap:
    phone: ${JOLAY_ADMIN_PHONE:}
    password: ${JOLAY_ADMIN_PASSWORD:}
    name: ${JOLAY_ADMIN_NAME:JOLAY Admin}

name: CI
on:
  push: { branches: [main, "ccr-*"] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: jolay_test, POSTGRES_USER: jolay, POSTGRES_PASSWORD: jolay }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jolay" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Test
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: Build jar
        working-directory: backend
        run: ./gradlew bootJar -x test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-report, path: backend/build/reports/tests }

  # The apps' real data layer against the real backend (see scripts/live-contract-test.sh): catches JSON/contract drift the fake-API widget tests cannot.
  live-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_DB: jolay_live, POSTGRES_USER: jolay, POSTGRES_PASSWORD: jolay }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jolay" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Live contract test
        run: scripts/live-contract-test.sh

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/admin-web/package-lock.json }
      - run: npm ci && npm run build && npm test
        working-directory: apps/admin-web

  partner-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/partner-web/package-lock.json }
      - run: npm ci && npm run build && npm test
        working-directory: apps/partner-web

  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [customer-app, driver-app] }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: apps/${{ matrix.app }}

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jolay-backend:ci backend

# Local development stack:  docker compose up --build
# Copy .env.example to .env first. Nothing here is production configuration.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jolay
      POSTGRES_USER: jolay
      POSTGRES_PASSWORD: ${JOLAY_DB_PASSWORD:-jolay}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jolay -d jolay"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: ""         # dev behaviour (no prod log format)
      JOLAY_DB_URL: jdbc:postgresql://db:5432/jolay
      JOLAY_DB_USER: jolay
      JOLAY_DB_PASSWORD: ${JOLAY_DB_PASSWORD:-jolay}
      JOLAY_JWT_SECRET: ${JOLAY_JWT_SECRET:-local-dev-secret-local-dev-secret-0123456789}
      JOLAY_SMS_LOG_CODE: "true"          # DEV ONLY: OTP is written to the backend log
      JOLAY_ADMIN_PHONE: ${JOLAY_ADMIN_PHONE:-+77000000000}
      JOLAY_ADMIN_PASSWORD: ${JOLAY_ADMIN_PASSWORD:-ChangeMe12345}
      JOLAY_CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports: ["8080:8080"]

  admin-web:
    build: ./apps/admin-web
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  pgdata:
